<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="37" fill="#1a2e1a"/>
  <g transform="translate(90,95)">
    <!-- Stem -->
    <rect x="-3" y="40" width="6" height="18" rx="3" fill="#5fba7a"/>
    <!-- Hop cone body - overlapping scales -->
    <ellipse cx="0" cy="-30" rx="22" ry="28" fill="#5fba7a"/>
    <ellipse cx="-15" cy="-20" rx="16" ry="22" fill="#6bc88b" transform="rotate(-20)"/>
    <ellipse cx="15" cy="-20" rx="16" ry="22" fill="#4dab6a" transform="rotate(20)"/>
    <ellipse cx="-10" cy="-10" rx="14" ry="18" fill="#5fba7a" transform="rotate(-10)"/>
    <ellipse cx="10" cy="-10" rx="14" ry="18" fill="#5fba7a" transform="rotate(10)"/>
    <ellipse cx="0" cy="5" rx="12" ry="15" fill="#6bc88b"/>
    <!-- Highlight -->
    <ellipse cx="-6" cy="-35" rx="6" ry="10" fill="#8fd9a8" transform="rotate(-15)" opacity="0.6"/>
  </g>
</svg>
